name: Chalant
options:
  bundleIdPrefix: com.cj
  deploymentTarget:
    macOS: "15.0"
packages:
  # Self-updates without an Apple Developer account: archives are
  # signed with our own EdDSA key (login keychain, generated by
  # Sparkle's generate_keys; SUPublicEDKey below is its public half).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  # Whisper on device. Arrived 2026-08-18 as "Better hearing", a second ear
  # that corrected the words after they landed; from 1.42.0 it is one of three
  # selectable recognizers, and the most accurate of them on the founder's own
  # corpus (24.15 corrections per 100 words against Apple's 28.21) at about
  # six times the decode time. Not the default for that reason, and because it
  # costs a 606 MB download. verification/EAR_2026-08-17.md, EVAL-LOG 09-14.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.0
  # Parakeet TDT v3 on device, one of the three recognizers from 1.42.0.
  #
  # **Not the default, and that was measured rather than assumed.** Part 0
  # §0.12 warned that Parakeet's lineage scores roughly twice Whisper's word
  # error on Indian-accented English and said to cut its engine role if it
  # underperformed Apple on the corpus. It did: 30.98 corrections per 100
  # words against Apple's 28.21 on the founder's own 60 labelled English rows.
  # It stays because it is exactly as fast as Apple (0.135 s against 0.134 s)
  # and one speaker cannot settle a US-English model's value for everyone.
  # Full table in EVAL-LOG 2026-09-14.
  #
  # **Pinned exactly, never a range, and Part 0 §0.8 is the reason:** this
  # project ships releases days apart and shipped two breaking changes in
  # 2026 (`DownloadUtils` to `ModelHub`, the v0.12.6 actor conversion). The
  # third one is the one that bites here: `AsrManager.initialize(models:)`,
  # `configure(models:)` and `transcribe(samples, source:)` all appear in
  # the published README, Documentation/API.md and docs.fluidinference.com,
  # and NONE of them exist at 0.15.7. Only `Sources/**/*.swift` at the
  # pinned tag is authoritative here; the Markdown is stale. Verified by
  # compiling the whole surface we use against the checkout before the
  # first line of app code was written.
  #
  # Pulls one remote binary artifact of its own, `NemoTextProcessing`
  # (text-processing-rs v0.3.0), for inverse text normalisation. Swift 6.2+
  # toolchains read `Package@swift-6.2.swift`, where that is a package trait
  # enabled by default; xcodegen has no way to pass traits, so the default
  # set is what ships.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.7
  # Dictation's pure core, merged 2026-08-15 by git subtree so its 20 commits
  # of history came along. The package boundary is kept on purpose: it lets
  # Core stay Swift 6 `complete` while this app target stays 5.9 `targeted`,
  # it preserves the rule that Core imports only Foundation, and it keeps its
  # 48 swift-testing tests running untouched. Folding the files into
  # Chalant/Features/ would mean porting all 48 to XCTest for nothing.
  ChalantDictationCore:
    path: Dictation
targets:
  Chalant:
    type: application
    platform: macOS
    sources:
      - Chalant
      # Dictation's impure shell: audio capture, the Speech modules, the left
      # Option event tap and the insertion ladder. The standalone app's own
      # App.swift, Info.plist, entitlements and xcodegen spec are all deleted:
      # a second buildable dictation app is how you get doubled text, and it
      # happened on 2026-08-15 when the DerivedData build was caught pasting
      # into the founder's terminal. Chalant's Info.plist and entitlements are
      # a strict superset of what that bundle declared (verified before the
      # delete), so nothing was lost with it.
      - path: Dictation/ChalantDictationApp
      # MediaRemote adapter (BSD 3-Clause, github.com/ungive/mediaremote-adapter):
      # perl loads the framework to stream any app's now-playing data.
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
      - path: Vendor/MediaRemoteAdapter/MediaRemoteAdapterTestClient
        buildPhase: resources
      # Same script Claude Code's Notification and Stop hooks call into.
      # Bundled so a shipped Chalant can tell a user exactly where it
      # lives (2026-08-01: it was nowhere in the bundle, so the
      # Sessions pane could not name a real path to paste).
      - path: scripts/chalant-hook
        buildPhase: resources
      # The MCP server whose only tool is asking you something. Bundled
      # for the same reason: the Sessions pane has to name a real path
      # for `claude mcp add`, and a path it made up is a command that
      # fails when somebody pastes it.
      - path: scripts/chalant-ask-mcp
        buildPhase: resources
      # The shim Cursor and Codex call. Neither runs HTTP hooks, so
      # both need a command in between, and it has to be a real path
      # inside the bundle for their config to point at.
      - path: scripts/chalant-gate
        buildPhase: resources
    dependencies:
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
      - package: Sparkle
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: ChalantDictationCore
        product: ChalantDictationCore
    info:
      path: Chalant/Info.plist
      properties:
        # Version lives here: xcodegen regenerates Info.plist on every
        # run, so a version bumped only in the plist silently resets.
        CFBundleShortVersionString: 1.42.0
        CFBundleVersion: "201"
        # Sparkle: the feed rides the Pages site; checks stay OUR quiet
        # daily UpdateChecker (Sparkle's own scheduler off, no consent
        # dialog); Sparkle acts only when the user asks to install.
        SUFeedURL: https://chetanjon.github.io/chalant/appcast.xml
        SUPublicEDKey: zGkziBnChyV4FL72qKbSpXTybySJ9+4wOzbWXodsQmM=
        SUEnableAutomaticChecks: false
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Chalant
        # "nothing more" was true until 2026-08-15 and is not any more:
        # dictation asks System Events to paste into whatever app you are in,
        # which is a far larger capability than controlling a music player.
        # Leaving the old sentence would have shipped a false bound in the one
        # dialog where a user decides whether to trust the app, which is the
        # same failure the 2026-08-12 audit caught in the weather copy.
        NSAppleEventsUsageDescription: "Chalant asks System Events to paste your dictated text into the app you were using. It also controls your music players and sends the Messages you dictate."
        NSContactsUsageDescription: Chalant looks up the person you name so a message reaches the right number, and reads the names in Contacts so dictation spells them right. Names only, on this Mac.
        # Dictation is macOS's own, and macOS sends it to Apple when the
        # local speech model is not ready (VoiceController sets
        # requiresOnDeviceRecognition false on purpose, for reliability).
        # These two strings are the one place a user actually reads, so
        # they say what really happens rather than what we would prefer.
        # "left Option" was true until 1.42.0 made the hold key a setting. The
        # one dialog a user actually reads must not name a key they may have
        # moved, and it cannot read their settings, so it names neither.
        NSMicrophoneUsageDescription: "Hold the notch to talk to Chalant, or hold your dictation key to dictate into whatever you are typing in. Dictation is transcribed entirely on this Mac. Island commands use macOS dictation, which goes to Apple's service when the local model is not ready."
        NSSpeechRecognitionUsageDescription: "Turns your words into text at your cursor, and into actions on the island. Dictation runs entirely on this Mac. Island commands use macOS dictation, which runs here when its local model is ready and through Apple's service when it is not. The answer itself never leaves."
        NSRemindersFullAccessUsageDescription: Chalant creates the reminders you set.
        NSCalendarsFullAccessUsageDescription: Chalant adds events and reads today's agenda.
        # Both spellings on purpose: macOS reads the classic key, but
        # CLLocationManager's authorization ask is documented to do
        # NOTHING unless the WhenInUse key is present too. Only the
        # classic one shipped for a while, and the location prompt
        # never appeared at all.
        NSLocationUsageDescription: Chalant reads your approximate location to show the weather beside your day.
        NSLocationWhenInUseUsageDescription: Chalant reads your approximate location to show the weather beside your day.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cj.chalant
        # CODE_SIGN_STYLE lives per-configuration below, not here.
        # Automatic signing picks the identity itself and REFUSES a
        # hand-picked one: naming Developer ID while leaving this on
        # Automatic fails the archive outright with "conflicting
        # provisioning settings".
        #
        # One team, two identities, on purpose (see configs below).
        # Development signing is local and fast, and keeps a build's
        # Keychain and TCC grants stable across rebuilds; ad-hoc
        # re-signing made every rebuild look like a new app and reset
        # both. Developer ID is the only identity Gatekeeper accepts on
        # somebody else's Mac and the only one notarization will take,
        # so it is reserved for archives.
        #
        # This value is the single source of truth for the team.
        # packaging/ExportOptions.plist and scripts/dev both read it,
        # and scripts/release refuses to run if they have drifted apart.
        DEVELOPMENT_TEAM: WV59PZX4A3
        SWIFT_VERSION: "5.9"
        # The compiler had no opinion on cross-actor access before this,
        # which is why the data race on the audio render thread sat in
        # NoiseEngine unremarked for as long as it did. "targeted" checks
        # the code that already opted into concurrency, which is all of
        # this app, and the tree builds clean under it.
        SWIFT_STRICT_CONCURRENCY: targeted
        # One Objective-C file, for the one thing Swift cannot do:
        # catch an NSException. AVAudioEngine raises rather than returns
        # for a family of misuse, and Swift has no catch that sees it.
        SWIFT_OBJC_BRIDGING_HEADER: Chalant/Chalant-Bridging-Header.h
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Notarization requires the hardened runtime, so the doors it
        # closes are opened one at a time in Chalant.entitlements.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Chalant/Chalant.entitlements
      configs:
        # Archives are the only build that has to satisfy Gatekeeper on
        # a Mac that is not this one, so they are the only build that
        # pays for a Developer ID identity. Everything else keeps the
        # fast local one.
        #
        # The styles differ because the identities do. Development wants
        # Automatic, which fetches and renews certificates on its own
        # and is what makes scripts/dev a one-liner. Developer ID has to
        # be Manual: under Automatic, Xcode insists on choosing the
        # identity itself and rejects the build for naming one.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Developer ID signing for a Mac app outside the App Store
          # needs no profile; saying so stops Xcode looking for one.
          PROVISIONING_PROFILE_SPECIFIER: ""
  ChalantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ChalantTests
    dependencies:
      - target: Chalant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cj.chalant.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WV59PZX4A3
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Chalant:
    build:
      targets:
        Chalant: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChalantTests
    archive:
      config: Release
