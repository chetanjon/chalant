name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # macOS 26, and it is not the Swift version that forces it even though that
    # is what the error says. `Package.swift` asks for tools 6.2 and the
    # macos-15 runner has 6.1, but fixing only that would fail one step later:
    # dictation imports `FoundationModels` and `Speech.SpeechAnalyzer`, and
    # neither symbol exists in the macOS 15 SDK. `@available(macOS 26)` gates
    # when code RUNS, never whether it compiles.
    #
    # This job has been red on every commit since the dictation merge and
    # nobody noticed, which means the suite has not run in CI at all since
    # then. Every green number reported in that window came from one laptop.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests
        run: >
          xcodebuild test
          -project Chalant.xcodeproj
          -scheme Chalant
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""

  # Chalant's landing page exists twice, here and in the private portfolio
  # repo, and most downloads come from the copy this repo cannot see. It
  # is deliberate that a change to docs/index.html turns this job red
  # until the portfolio is updated AND deployed: that red is the only
  # thing standing between an edit here and a page elsewhere that quietly
  # keeps making the old promise. Ubuntu on purpose, since it needs
  # nothing but python3 and curl, and it must not wait on a Mac runner.
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The two landing pages still say the same thing
        run: scripts/check-landing-copy
