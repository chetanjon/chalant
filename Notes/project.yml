# Notes: a dark, minimal notes app for iPhone. Native SwiftUI, SwiftData with
# CloudKit sync, and a Lock Screen widget that shows the one pinned note.
#
# Generate the Xcode project with `xcodegen generate` from this directory
# (Notes.xcodeproj is ignored by git, same rule as Chalant.xcodeproj above).
name: Notes
options:
  bundleIdPrefix: com.cj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # Same team as Chalant. project.yml is the only place it is written down.
    DEVELOPMENT_TEAM: WV59PZX4A3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Widget and app share one version so App Store Connect accepts the build:
    # an extension whose version differs from its host is rejected at upload.
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Notes:
    type: application
    platform: iOS
    sources:
      - path: Notes
    dependencies:
      - target: NotesWidget
        embed: true
    info:
      path: Notes/Info.plist
      properties:
        CFBundleDisplayName: Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Dark only, at the OS level too, so no system sheet or alert ever
        # flashes white.
        UIUserInterfaceStyle: Dark
        # A launch screen the same black as the app: the acceptance list
        # says "no flashes of white", and the default launch screen is white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # notes://note/<uuid>, the URL the widget opens.
        CFBundleURLTypes:
          - CFBundleURLName: com.cj.notes
            CFBundleURLSchemes:
              - notes
        # CloudKit pushes a silent notification when another device writes;
        # without this mode SwiftData only syncs when the app is opened.
        UIBackgroundModes:
          - remote-notification
        # Nothing here encrypts beyond what iOS does; answering up front
        # skips the export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Notes/Notes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cj.notes
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cj.notes
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cj.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NotesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NotesWidget
      # The one file the widget shares with the app: the pinned-note record
      # and the App Group defaults it lives in.
      - path: Notes/Logic/PinStore.swift
      - path: Notes/Theme/Theme.swift
    info:
      path: NotesWidget/Info.plist
      properties:
        CFBundleDisplayName: Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NotesWidget/NotesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cj.notes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cj.notes.widget
        SKIP_INSTALL: YES
  NotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotesTests
    dependencies:
      - target: Notes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cj.notes.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Notes:
    build:
      targets:
        Notes: all
        NotesWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotesTests
    archive:
      config: Release
